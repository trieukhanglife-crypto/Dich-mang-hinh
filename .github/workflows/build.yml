name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen ma nguon
        run: |
          if [ -f ScreenTranslator.zip ]; then
            unzip -q -o ScreenTranslator.zip -d src
            echo "DIR=src/ScreenTranslator" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon
      - name: Doi ten file
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" DichManHinh.apk
      - name: Dang len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dich Man Hinh - ban ${{ github.run_number }}
          files: DichManHinh.apk
